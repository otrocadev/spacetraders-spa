<st-surface>
  <app-icon-title
    icon="car-turbine"
    title="{{ engineDetails().name + ' - Quality: ' + engineDetails().quality }}"
  ></app-icon-title>

  <main class="engine-details">
    <section class="engine-details__group">
      <h4 class="engine-details__label">Specs</h4>
      <div class="engine-details-item" [appTooltip]="'Engine speed'">
        <i-tabler-icon [name]="'gauge'" />
        <span class="engine-details-item__text">{{ engineDetails().speed }}</span>
      </div>
    </section>

    <section class="engine-details__group">
      <h4 class="engine-details__label">Requirements</h4>
      <div class="engine-details-item" [appTooltip]="'Engine power requirement'">
        <i-tabler-icon [name]="'bolt'" />
        <span class="engine-details-item__text">{{ engineDetails().requirements.power }}</span>
      </div>
      <div class="engine-details-item" [appTooltip]="'Crew required to operate the engine'">
        <i-tabler-icon [name]="'users'" />
        <span class="engine-details-item__text">{{ engineDetails().requirements.crew }}</span>
      </div>
    </section>

    <st-progress label="Condition" [value]="engineCondition()" [max]="100" tone="brand" />
    <st-progress label="Integrity" [value]="engineIntegrity()" [max]="100" tone="accent" />
  </main>
</st-surface>
